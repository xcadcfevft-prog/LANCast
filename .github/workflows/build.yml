          need = os.environ.get('NEED_DIR', '')
          if need and not os.path.isdir(need):
              print(f'::error::{need}/ directory not found'); sys.exit(1)
          print('OK, workspace ready')

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-win-${{ hashFiles('windows/package.json') }}
          restore-keys: npm-win-

      # Electron 二进制、NSIS、winCodeSign 等每次都要从 GitHub 下载，缓存后基本省掉这段时间
      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-win-${{ hashFiles('windows/package.json') }}
          restore-keys: electron-win-

      - name: Install dependencies
        working-directory: windows
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build exe (installer only)
        working-directory: windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: LANCast-windows-exe
          path: |
            windows/dist/*.exe
          if-no-files-found: error
          compression-level: 0        # exe 已经压缩过，不再二次压缩，上传更快
