          cands.sort(reverse=True)

          # 2) 取最新的、且里面确实有 android/ 或 windows/ 目录的那个（不是项目包的 zip 自动忽略）
          chosen = None
          for t, _, p in cands:
              try:
                  with zipfile.ZipFile(p) as z:
                      names = ['/' + n.replace('\\', '/') for n in z.namelist()]
                  if any('/android/' in n or '/windows/' in n for n in names):
                      chosen = p; break
                  print(f'skip (not a project zip): {p}')
              except zipfile.BadZipFile:
                  print(f'skip (bad zip): {p}')

          # 3) 解压到临时目录，再覆盖进工作区（zip 里有没有顶层目录都行）
          if not chosen:
