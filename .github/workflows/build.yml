          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in SKIP]
              for f in files:
                  if f.lower().endswith('.zip'):
                      p = os.path.normpath(os.path.join(root, f)).replace('\\', '/')
                      out = git('log', '-1', '--format=%ct', '--', p).stdout.strip()
                      t = int(out) if out.isdigit() else 0
                      print(f'found: {p} (committed at {t})')
                      cands.append((t, os.path.getmtime(p), p))
          cands.sort(reverse=True)

          # 2) 取最新的、且里面确实有 android/ 或 windows/ 目录的那个（不是项目包的 zip 自动忽略）
          chosen = None
          for t, _, p in cands:
              try:
                  with zipfile.ZipFile(p) as z:
                      names = ['/' + n.replace('\\', '/') for n in z.namelist()]
                  if any('/android/' in n or '/windows/' in n for n in names):
                      chosen = p; break
                  print(f'skip (not a project zip): {p}')
              except zipfile.BadZipFile:
                  print(f'skip (bad zip): {p}')

          # 3) 解压到临时目录，再覆盖进工作区（zip 里有没有顶层目录都行）
          if not chosen:
              print('no project zip found, using repository files as-is')
          else:
              print('USING:', chosen)
              tmp = os.path.join(tempfile.gettempdir(), 'lancast_proj')
              shutil.rmtree(tmp, ignore_errors=True); os.makedirs(tmp)
              with zipfile.ZipFile(chosen) as z:
                  z.extractall(tmp)
              root = tmp
              if not is_project_dir(root):
                  hit = None
                  for cur, dirs, _ in os.walk(tmp):
                      if cur[len(tmp):].count(os.sep) > 3: dirs[:] = []; continue
                      if is_project_dir(cur): hit = cur; break
                  if hit: root = hit
              print('project root in zip:', root)
              shutil.copytree(root, '.', dirs_exist_ok=True)

          need = os.environ.get('NEED_DIR', '')
          if need and not os.path.isdir(need):
              print(f'::error::{need}/ directory not found'); sys.exit(1)
          print('OK, workspace ready')

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-win-${{ hashFiles('windows/package.json') }}
          restore-keys: npm-win-

      - name: Install dependencies (skip Electron download)
        working-directory: windows
        run: npm install --no-audit --no-fund --prefer-offline --ignore-scripts

      - name: Run tests
        working-directory: windows
        run: npm test
        continue-on-error: true

  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 取仓库里“最近提交”的项目 zip（文件名随便叫什么、放在哪个文件夹都行；里面没有 android/ 或 windows/ 的 zip 会被忽略），
