name: Build

on:
  push:
  workflow_dispatch:

# 连续上传 / 连续推送时，只保留最新一次构建，旧的直接取消（省排队和运行时间）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 取仓库里“最近提交”的项目 zip（文件名随便叫什么、放在哪个文件夹都行；里面没有 android/ 或 windows/ 的 zip 会被忽略），
      # 解压后覆盖进工作区。没有 zip 时，直接用仓库里已经解开的文件。
      - name: Unpack newest project zip (any file name)
        shell: python3 {0}
        env:
          PYTHONUTF8: "1"
          NEED_DIR: android
        run: |
          import os, shutil, subprocess, sys, tempfile, zipfile

          def git(*a):
              return subprocess.run(['git', '-c', 'core.quotepath=off', '--literal-pathspecs', *a],
                                    capture_output=True, text=True, encoding='utf-8', errors='replace')

          def is_project_dir(d):
              return os.path.isdir(os.path.join(d, 'android')) or os.path.isdir(os.path.join(d, 'windows'))

          # 1) 找出仓库里所有 .zip（任意文件名 / 任意子文件夹；跳过项目自己的目录），按“最近一次提交时间”从新到旧排
          SKIP = {'.git', 'node_modules', 'android', 'windows', 'docs', 'assets', '.github'}
          cands = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in SKIP]
              for f in files:
                  if f.lower().endswith('.zip'):
                      p = os.path.normpath(os.path.join(root, f)).replace('\\', '/')
                      out = git('log', '-1', '--format=%ct', '--', p).stdout.strip()
                      t = int(out) if out.isdigit() else 0
                      print(f'found: {p} (committed at {t})')
                      cands.append((t, os.path.getmtime(p), p))
          cands.sort(reverse=True)

          # 2) 取最新的、且里面确实有 android/ 或 windows/ 目录的那个（不是项目包的 zip 自动忽略）
          chosen = None
          for t, _, p in cands:
              try:
                  with zipfile.ZipFile(p) as z:
                      names = ['/' + n.replace('\\', '/') for n in z.namelist()]
                  if any('/android/' in n or '/windows/' in n for n in names):
                      chosen = p; break
                  print(f'skip (not a project zip): {p}')
              except zipfile.BadZipFile:
                  print(f'skip (bad zip): {p}')

          # 3) 解压到临时目录，再覆盖进工作区（zip 里有没有顶层目录都行）
          if not chosen:
              print('no project zip found, using repository files as-is')
          else:
              print('USING:', chosen)
              tmp = os.path.join(tempfile.gettempdir(), 'lancast_proj')
              shutil.rmtree(tmp, ignore_errors=True); os.makedirs(tmp)
              with zipfile.ZipFile(chosen) as z:
                  z.extractall(tmp)
              root = tmp
              if not is_project_dir(root):
                  hit = None
                  for cur, dirs, _ in os.walk(tmp):
                      if cur[len(tmp):].count(os.sep) > 3: dirs[:] = []; continue
                      if is_project_dir(cur): hit = cur; break
                  if hit: root = hit
              print('project root in zip:', root)
              shutil.copytree(root, '.', dirs_exist_ok=True)

          need = os.environ.get('NEED_DIR', '')
          if need and not os.path.isdir(need):
              print(f'::error::{need}/ directory not found'); sys.exit(1)
          print('OK, workspace ready')

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Gradle 版本以 android/gradle/wrapper/gradle-wrapper.properties 为唯一来源（AGP 升级时只改一处）。
      - name: Read Gradle version from wrapper properties
        id: gradlever
        shell: bash
        run: |
          ver=$(grep -E '^distributionUrl' android/gradle/wrapper/gradle-wrapper.properties \
                | grep -oE 'gradle-[0-9]+(\.[0-9]+)+' | head -n1 | sed 's/^gradle-//')
          if [ -z "$ver" ]; then ver="8.13"; echo "wrapper version not found, fallback to $ver"; fi
          echo "Gradle version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      # setup-gradle 会自动缓存 Gradle 依赖 / 构建缓存（默认只在默认分支写入缓存，其它分支只读）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradlever.outputs.version }}

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --parallel --build-cache --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LANCast-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0        # apk 本身已是压缩包，不再二次压缩，上传更快

  # 测试单独成一个 job，和打包并行跑（测试不需要 Electron，所以不下载它）；测试失败不影响出包
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 取仓库里“最近提交”的项目 zip（文件名随便叫什么、放在哪个文件夹都行；里面没有 android/ 或 windows/ 的 zip 会被忽略），
      # 解压后覆盖进工作区。没有 zip 时，直接用仓库里已经解开的文件。
      - name: Unpack newest project zip (any file name)
        shell: python {0}
        env:
          PYTHONUTF8: "1"
          NEED_DIR: windows
        run: |
          import os, shutil, subprocess, sys, tempfile, zipfile

          def git(*a):
              return subprocess.run(['git', '-c', 'core.quotepath=off', '--literal-pathspecs', *a],
                                    capture_output=True, text=True, encoding='utf-8', errors='replace')

          def is_project_dir(d):
              return os.path.isdir(os.path.join(d, 'android')) or os.path.isdir(os.path.join(d, 'windows'))

          # 1) 找出仓库里所有 .zip（任意文件名 / 任意子文件夹；跳过项目自己的目录），按“最近一次提交时间”从新到旧排
          SKIP = {'.git', 'node_modules', 'android', 'windows', 'docs', 'assets', '.github'}
